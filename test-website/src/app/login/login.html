<section class="auth-layout shell">
  <div class="auth-story"><p class="eyebrow">WELCOME BACK TO SAWFTWARE GAMES</p><h1>Your next<br>chapter <span>awaits.</span></h1><p>Step back into the community. Follow the games, share your thoughts, and be part of the journey.</p><div class="auth-decoration" aria-hidden="true">SG<span>+</span></div></div>
  <div class="form-panel auth-panel"><span class="badge">PLAYER ACCESS</span><h2>Good to see you again.</h2><p class="form-intro">Log in to your Sawftware Games account.</p><form [formGroup]="form" (ngSubmit)="submit()"><div class="field"><label for="login-email">Email address</label><input id="login-email" type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label for="login-password">Password</label><input id="login-password" type="password" formControlName="password" autocomplete="current-password" placeholder="Enter your password" required></div><p class="form-message" role="status">{{ message() }}</p><button class="button full-width" type="submit" [disabled]="pending()">{{ pending() ? 'Logging in…' : 'Log in' }} <span aria-hidden="true">↗</span></button></form><p class="auth-switch">New around here? <a routerLink="/signup">Create an account</a></p></div>
</section>
